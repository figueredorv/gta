<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="clip-outline-left">
      <rect x="0" y="0" width="271" height="512"/>
    </clipPath>
    <clipPath id="clip-outline-right">
      <rect x="271" y="0" width="241" height="512"/>
    </clipPath>
    <clipPath id="clip-fill-left">
      <rect x="0" y="0" width="276" height="512"/>
    </clipPath>
    <clipPath id="clip-fill-right">
      <rect x="276" y="0" width="236" height="512"/>
    </clipPath>

    <g id="logo-letters">
      <!-- g -->
      <path fill-rule="evenodd" d="M 70 116 H 160 V 355 A 40 40 0 0 1 120 395 H 30 V 366 H 120 A 10 10 0 0 0 130 356 V 336 H 70 A 40 40 0 0 1 30 296 V 156 A 40 40 0 0 1 70 116 Z M 80 146 V 306 H 110 V 146 Z"/>
      <!-- t -->
      <path d="M 191 116 H 241 V 161 H 321 V 191 H 241 V 355 A 10 10 0 0 0 251 365 H 261 A 10 10 0 0 0 271 355 V 221 H 321 V 355 A 40 40 0 0 1 281 395 H 231 A 40 40 0 0 1 191 355 Z"/>
      <!-- a -->
      <path fill-rule="evenodd" d="M 392 116 H 442 A 40 40 0 0 1 482 156 V 395 H 392 A 40 40 0 0 1 352 355 V 261 A 40 40 0 0 1 392 221 H 432 V 191 H 352 V 156 A 40 40 0 0 1 392 116 Z M 402 251 V 365 H 432 V 251 Z"/>
    </g>

    <g id="logo-sharp-corners">
      <!-- g bottom-left foot -->
      <rect x="0" y="336" width="40" height="89"/>
      <!-- t top bar -->
      <rect x="161" y="86" width="110" height="45"/>
      <!-- a bottom-right foot -->
      <rect x="472" y="385" width="40" height="40"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <!-- Left half outline (#012231) -->
    <g clip-path="url(#clip-outline-left)">
      <use href="#logo-letters" fill="#012231" stroke="#012231" stroke-width="60" stroke-linejoin="round"/>
      <use href="#logo-sharp-corners" fill="#012231"/>
    </g>

    <!-- Right half outline (#000000) -->
    <g clip-path="url(#clip-outline-right)">
      <use href="#logo-letters" fill="#000000" stroke="#000000" stroke-width="60" stroke-linejoin="round"/>
      <use href="#logo-sharp-corners" fill="#000000"/>
    </g>

    <!-- Left half letter fill (#ffffff) -->
    <use href="#logo-letters" fill="#ffffff" clip-path="url(#clip-fill-left)"/>

    <!-- Right half letter fill (#eff6f9) -->
    <use href="#logo-letters" fill="#eff6f9" clip-path="url(#clip-fill-right)"/>
  </g>
</svg>
